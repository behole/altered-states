# Git hooks for the Python quality toolchain.
#
#   pre-commit install                 # enable on commit
#   pre-commit run --all-files         # run everything on the whole repo
#   make check                         # same checks without pre-commit
#
# Every hook below is backed by a real config in pyproject.toml, so a local
# invocation and a hook invocation cannot drift apart.

default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Large-file guardrails. Generated media under the music experiment
      # folders is an intentional exception with a much higher ceiling.
      - id: check-added-large-files
        name: check-added-large-files (1 MB cap)
        args: ["--maxkb=1024"]
        exclude: ^(experiments/music/.*/audio/|site/music/|site/index\.html$|tests/responses/)
      - id: check-added-large-files
        alias: check-added-large-files-media
        name: check-added-large-files (12 MB media cap)
        args: ["--maxkb=12288"]
        files: ^(experiments/music/.*/audio/|site/music/)
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
        types_or: [python, toml, yaml]
      - id: trailing-whitespace
        types_or: [python, toml, yaml]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.4
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        args: ["--config-file=pyproject.toml"]
        additional_dependencies:
          - "types-requests==2.33.0.20261030"
          - "types-pyyaml==6.0.12.20261030"

  # Dead code and duplication are repo-wide checks, so they ignore the file
  # list pre-commit passes and read their config from pyproject.toml instead.
  - repo: local
    hooks:
      - id: vulture
        name: vulture (dead code)
        entry: vulture
        language: python
        additional_dependencies: ["vulture==2.16"]
        types: [python]
        pass_filenames: false
      - id: pylint-duplicate-code
        name: pylint (duplicate code)
        entry: pylint --disable=all --enable=duplicate-code build.py watch.py bin experiments
        language: python
        additional_dependencies: ["pylint==4.1.3"]
        types: [python]
        pass_filenames: false
