name: Alerts

# Evaluates `alerts/alerts.yaml` against the metrics snapshot the build and lab
# produce. This is the alerting path: thresholds live in the repository, so a
# paging condition is reviewed like any other change.
#
# `ALERT_WEBHOOK_URL` is optional. When unset, firing alerts appear in the job
# summary and fail the run — which is still an alert, delivered by GitHub.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "alerts/**"
      - "bin/check_alerts.py"

permissions:
  contents: read
  issues: write

concurrency:
  group: alerts
  cancel-in-progress: false

jobs:
  evaluate:
    name: Evaluate thresholds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install -r bin/requirements.lock

      - name: Policy is valid
        run: python bin/check_alerts.py --validate-only

      # The snapshot is produced by the previous build. In a fresh CI checkout
      # there is no build yet, so run one to obtain a real snapshot.
      - name: Produce a metrics snapshot
        run: python build.py

      - name: Restore the consecutive-fire state
        uses: actions/cache/restore@v6
        with:
          path: .alert-state.json
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-

      - name: Evaluate
        id: alerts
        run: |
          set +e
          python bin/check_alerts.py \
            --snapshot runtime/metrics/altered-states.prom \
            --state .alert-state.json \
            --format text | tee alerts.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Save the consecutive-fire state
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .alert-state.json
          key: alert-state-${{ github.run_id }}

      - name: Notify the webhook
        if: steps.alerts.outputs.exit_code != '0' && env.ALERT_WEBHOOK_URL != ''
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          python bin/check_alerts.py \
            --snapshot runtime/metrics/altered-states.prom \
            --format json > alerts.json
          curl --fail --silent --show-error \
            --header "Content-Type: application/json" \
            --data @alerts.json \
            "$ALERT_WEBHOOK_URL"

      - name: Summarize
        if: always()
        run: |
          {
            echo "## Alert evaluation"
            echo '```'
            cat alerts.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on a critical alert
        if: steps.alerts.outputs.exit_code != '0'
        run: |
          echo "A critical alert is firing. Read the runbook named above." >&2
          exit 1

      # The error-to-insight step: a firing alert becomes a tracked issue with
      # the signal, the threshold, and the runbook inline, so triage starts from
      # the issue rather than from a workflow log that expires.
      - name: File or update a triage issue
        if: always() && steps.alerts.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python bin/check_alerts.py \
            --snapshot runtime/metrics/altered-states.prom \
            --format json > alerts.json

          title="alert: critical threshold firing"
          marker="<!-- alert-triage -->"
          {
            echo "$marker"
            echo "A critical alert from \`alerts/alerts.yaml\` is firing."
            echo
            echo '```json'
            cat alerts.json
            echo '```'
            echo
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "Start with the runbook named in the payload above."
          } > issue.md

          existing=$(gh issue list --label observability --state open --search "$title in:title" \
            --json number --jq '.[0].number' || true)
          if [ -n "${existing:-}" ]; then
            gh issue comment "$existing" --body-file issue.md
          else
            gh issue create \
              --title "$title" \
              --body-file issue.md \
              --label observability \
              --label "priority:high" || \
            gh issue create --title "$title" --body-file issue.md
          fi
