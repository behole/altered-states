name: Automated PR review

# Deterministic first pass: reads the diff, checks it against this repo's
# conventions (`bin/review_pr.py`), and posts one sticky comment plus a review
# state. It is not a substitute for a human review; it is the checklist that
# runs before one.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Convention review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7
        with:
          # The diff is computed against the merge base, so the full history of
          # the base branch has to be present.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Compute the diff
        run: |
          git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"
          git diff --no-color --unified=0 \
            "origin/${{ github.event.pull_request.base.ref }}...HEAD" > pr.diff
          echo "diff lines: $(wc -l < pr.diff)"

      - name: Review the diff
        id: review
        run: |
          set +e
          python bin/review_pr.py --diff-file pr.diff --output review.md
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Post or update the sticky comment
        uses: actions/github-script@v9
        env:
          EXIT_CODE: ${{ steps.review.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- automated-review -->';
            const body = `${marker}\n${fs.readFileSync('review.md', 'utf8')}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(
              (comment) => comment.user.type === 'Bot' && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Request changes on blocking findings
        if: steps.review.outputs.exit_code != '0'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('review.md', 'utf8');
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              event: 'REQUEST_CHANGES',
              body: `Blocking convention findings:\n\n${body}`,
            });

      # A passing run must clear the CHANGES_REQUESTED review an earlier failing
      # run left behind. Nothing else dismisses it: `dismiss_stale_reviews_on_push`
      # only covers approvals, and the ruleset blocks the merge while any
      # changes-requested review stands. This runs after the check has actually
      # re-reviewed the new head, so a fix clears the block and a regression
      # re-requests changes. Reviews from humans are never dismissed.
      - name: Clear a stale blocking review
        if: steps.review.outputs.exit_code == '0'
        uses: actions/github-script@v9
        with:
          script: |
            const query = `
              mutation($id: ID!, $message: String!) {
                dismissPullRequestReview(input: {pullRequestReviewId: $id, message: $message}) {
                  pullRequestReview { id state }
                }
              }`;
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            for (const review of reviews) {
              if (review.state !== 'CHANGES_REQUESTED') continue;
              if (review.user.login !== 'github-actions[bot]') continue;
              await github.graphql(query, {
                id: review.node_id,
                message:
                  'Superseded by a later convention review that found no blocking issues.',
              });
            }

      - name: Summarize in the job log
        run: |
          cat review.md >> "$GITHUB_STEP_SUMMARY"
          test "${{ steps.review.outputs.exit_code }}" = "0"
